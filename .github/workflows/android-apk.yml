name: Build MYRA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Add Android platform
        run: npx cap add android

      - name: Add MYRA permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.CALL_PHONE",
              "android.permission.SEND_SMS",
              "android.permission.READ_SMS",
              "android.permission.RECEIVE_SMS",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION"
          ]

          for permission in permissions:
              line = f'    <uses-permission android:name="{permission}" />'

              if permission not in text:
                  text = text.replace(
                      "<application",
                      line + "\n    <application",
                      1
                  )

          manifest.write_text(text)
          PY

      - name: Create MYRA Native Plugin
        run: |
          mkdir -p android/app/src/main/java/com/myra/ai

          cat > android/app/src/main/java/com/myra/ai/MyraNativePlugin.java <<'EOF'
          package com.myra.ai;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import android.telephony.SmsManager;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(name = "MyraNative")
          public class MyraNativePlugin extends Plugin {

              @PluginMethod
              public void requestPermission(PluginCall call) {
                  String permission = call.getString("permission");

                  if (permission == null) {
                      call.reject("Permission is required");
                      return;
                  }

                  String androidPermission = null;

                  switch (permission) {
                      case "RECORD_AUDIO":
                          androidPermission = Manifest.permission.RECORD_AUDIO;
                          break;

                      case "READ_CONTACTS":
                          androidPermission = Manifest.permission.READ_CONTACTS;
                          break;

                      case "CALL_PHONE":
                          androidPermission = Manifest.permission.CALL_PHONE;
                          break;

                      case "SEND_SMS":
                          androidPermission = Manifest.permission.SEND_SMS;
                          break;

                      case "POST_NOTIFICATIONS":
                          if (Build.VERSION.SDK_INT >= 33) {
                              androidPermission =
                                      Manifest.permission.POST_NOTIFICATIONS;
                          } else {
                              JSObject result = new JSObject();
                              result.put("granted", true);
                              call.resolve(result);
                              return;
                          }
                          break;

                      default:
                          call.reject("Unsupported permission");
                          return;
                  }

                  if (getContext().checkSelfPermission(androidPermission)
                          == PackageManager.PERMISSION_GRANTED) {

                      JSObject result = new JSObject();
                      result.put("granted", true);
                      call.resolve(result);

                  } else {
                      requestPermissions(
                              new String[]{androidPermission},
                              "permissionCallback"
                      );
                      call.save();
                  }
              }

              @PermissionCallback
              private void permissionCallback(PluginCall call) {
                  String permission = call.getString("permission");

                  String androidPermission = null;

                  if ("RECORD_AUDIO".equals(permission)) {
                      androidPermission = Manifest.permission.RECORD_AUDIO;

                  } else if ("READ_CONTACTS".equals(permission)) {
                      androidPermission = Manifest.permission.READ_CONTACTS;

                  } else if ("CALL_PHONE".equals(permission)) {
                      androidPermission = Manifest.permission.CALL_PHONE;

                  } else if ("SEND_SMS".equals(permission)) {
                      androidPermission = Manifest.permission.SEND_SMS;

                  } else if ("POST_NOTIFICATIONS".equals(permission)
                          && Build.VERSION.SDK_INT >= 33) {
                      androidPermission =
                              Manifest.permission.POST_NOTIFICATIONS;
                  }

                  boolean granted =
                          androidPermission != null &&
                          getContext().checkSelfPermission(androidPermission)
                          == PackageManager.PERMISSION_GRANTED;

                  JSObject result = new JSObject();
                  result.put("granted", granted);
                  call.resolve(result);
              }

              @PluginMethod
              public void call(PluginCall call) {
                  String phone = call.getString("phone");

                  if (phone == null || phone.trim().isEmpty()) {
                      call.reject("Phone number is required");
                      return;
                  }

                  if (getContext().checkSelfPermission(
                          Manifest.permission.CALL_PHONE)
                          != PackageManager.PERMISSION_GRANTED) {
                      call.reject("CALL_PHONE permission not granted");
                      return;
                  }

                  try {
                      Intent intent = new Intent(
                              Intent.ACTION_CALL,
                              Uri.parse("tel:" + phone)
                      );

                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                      getContext().startActivity(intent);
                      call.resolve();

                  } catch (Exception e) {
                      call.reject(
                              "Unable to make call: " +
                              e.getMessage()
                      );
                  }
              }

              @PluginMethod
              public void sms(PluginCall call) {
                  String phone = call.getString("phone");
                  String message = call.getString("message");

                  if (phone == null || phone.trim().isEmpty()) {
                      call.reject("Phone number is required");
                      return;
                  }

                  if (message == null) {
                      message = "";
                  }

                  if (getContext().checkSelfPermission(
                          Manifest.permission.SEND_SMS)
                          != PackageManager.PERMISSION_GRANTED) {
                      call.reject("SEND_SMS permission not granted");
                      return;
                  }

                  try {
                      SmsManager smsManager =
                              SmsManager.getDefault();

                      smsManager.sendTextMessage(
                              phone,
                              null,
                              message,
                              null,
                              null
                      );

                      call.resolve();

                  } catch (Exception e) {
                      call.reject(
                              "Unable to send SMS: " +
                              e.getMessage()
                      );
                  }
              }

              @PluginMethod
              public void openApp(PluginCall call) {
                  String packageName =
                          call.getString("packageName");

                  if (packageName == null ||
                      packageName.trim().isEmpty()) {
                      call.reject("Package name is required");
                      return;
                  }

                  try {
                      Intent intent =
                              getContext()
                                      .getPackageManager()
                                      .getLaunchIntentForPackage(
                                              packageName
                                      );

                      if (intent == null) {
                          call.reject("App is not installed");
                          return;
                      }

                      intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      getContext().startActivity(intent);
                      call.resolve();

                  } catch (Exception e) {
                      call.reject(
                              "Unable to open app: " +
                              e.getMessage()
                      );
                  }
              }

              @PluginMethod
              public void openAppSettings(PluginCall call) {
                  try {
                      Intent intent = new Intent(
                              Settings.ACTION_APPLICATION_DETAILS_SETTINGS
                      );

                      intent.setData(
                              Uri.parse(
                                      "package:" +
                                      getContext().getPackageName()
                              )
                      );

                      intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      getContext().startActivity(intent);
                      call.resolve();

                  } catch (Exception e) {
                      call.reject(
                              "Unable to open app settings: " +
                              e.getMessage()
                      );
                  }
              }
          }
          EOF

      - name: Configure MYRA MainActivity
        run: |
          cat > android/app/src/main/java/com/myra/ai/MainActivity.java <<'EOF'
          package com.myra.ai;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  registerPlugin(MyraNativePlugin.class);

                  super.onCreate(savedInstanceState);

                  if (getBridge() != null &&
                      getBridge().getWebView() != null) {

                      getBridge()
                              .getWebView()
                              .setWebChromeClient(
                                      new WebChromeClient() {

                                          @Override
                                          public void onPermissionRequest(
                                                  final PermissionRequest request) {

                                              runOnUiThread(() -> {

                                                  boolean microphoneGranted =
                                                          getApplicationContext()
                                                                  .checkSelfPermission(
                                                                          Manifest.permission.RECORD_AUDIO
                                                                  ) ==
                                                          PackageManager.PERMISSION_GRANTED;

                                                  boolean audioRequested =
                                                          request.getResources() != null;

                                                  boolean localOrigin =
                                                          request.getOrigin() != null &&
                                                          "https://localhost"
                                                                  .equals(
                                                                          request.getOrigin()
                                                                                  .toString()
                                                                  );

                                                  if (microphoneGranted &&
                                                      audioRequested &&
                                                      localOrigin) {

                                                      request.grant(
                                                              new String[]{
                                                                      PermissionRequest
                                                                              .RESOURCE_AUDIO_CAPTURE
                                                              }
                                                      );

                                                  } else {
                                                      request.deny();
                                                  }
                                              });
                                          }
                                      }
                              );
                  }
              }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
