name: Build MYRA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add MYRA Native Plugin
        run: |
          mkdir -p android/app/src/main/java/com/myra/ai

          cat > android/app/src/main/java/com/myra/ai/MyraNativePlugin.java <<'EOF'
          package com.myra.ai;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import android.telephony.SmsManager;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "MyraNative")
          public class MyraNativePlugin extends Plugin {

              @PluginMethod
              public void requestPermission(PluginCall call) {
                  String permission = call.getString("permission");

                  if (permission == null) {
                      call.reject("Permission is required");
                      return;
                  }

                  String androidPermission;

                  switch (permission) {
                      case "RECORD_AUDIO":
                          androidPermission = Manifest.permission.RECORD_AUDIO;
                          break;

                      case "READ_CONTACTS":
                          androidPermission = Manifest.permission.READ_CONTACTS;
                          break;

                      case "CALL_PHONE":
                          androidPermission = Manifest.permission.CALL_PHONE;
                          break;

                      case "SEND_SMS":
                          androidPermission = Manifest.permission.SEND_SMS;
                          break;

                      case "POST_NOTIFICATIONS":
                          if (Build.VERSION.SDK_INT >= 33) {
                              androidPermission =
                                  Manifest.permission.POST_NOTIFICATIONS;
                          } else {
                              JSObject result = new JSObject();
                              result.put("granted", true);
                              call.resolve(result);
                              return;
                          }
                          break;

                      default:
                          call.reject("Unsupported permission");
                          return;
                  }

                  if (getContext().checkSelfPermission(androidPermission)
                          == PackageManager.PERMISSION_GRANTED) {
                      JSObject result = new JSObject();
                      result.put("granted", true);
                      call.resolve(result);
                      return;
                  }

                  requestPermissions(
                      new String[]{androidPermission},
                      "permissionCallback"
                  );

                  call.save();
              }

              @com.getcapacitor.annotation.PermissionCallback
              private void permissionCallback(PluginCall call) {
                  String permission = call.getString("permission");
                  String androidPermission = null;

                  if ("RECORD_AUDIO".equals(permission)) {
                      androidPermission = Manifest.permission.RECORD_AUDIO;
                  } else if ("READ_CONTACTS".equals(permission)) {
                      androidPermission = Manifest.permission.READ_CONTACTS;
                  } else if ("CALL_PHONE".equals(permission)) {
                      androidPermission = Manifest.permission.CALL_PHONE;
                  } else if ("SEND_SMS".equals(permission)) {
                      androidPermission = Manifest.permission.SEND_SMS;
                  } else if ("POST_NOTIFICATIONS".equals(permission)
                          && Build.VERSION.SDK_INT >= 33) {
                      androidPermission =
                          Manifest.permission.POST_NOTIFICATIONS;
                  }

                  boolean granted =
                      androidPermission != null &&
                      getContext().checkSelfPermission(androidPermission)
                      == PackageManager.PERMISSION_GRANTED;

                  JSObject result = new JSObject();
                  result.put("granted", granted);
                  call.resolve(result);
              }

              @PluginMethod
              public void openAppSettings(PluginCall call) {
                  try {
                      Intent intent = new Intent(
                          Settings.ACTION_APPLICATION_DETAILS_SETTINGS
                      );

                      intent.setData(
                          Uri.parse(
                              "package:" +
                              getContext().getPackageName()
                          )
                      );

                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);

                      call.resolve();
                  } catch (Exception e) {
                      call.reject(
                          "Unable to open app settings: " +
                          e.getMessage()
                      );
                  }
              }
          }
          EOF

      - name: Register MYRA Native Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/java/com/myra/ai/MainActivity.java"
          )

          text = p.read_text()

          if "MyraNativePlugin" not in text:
              text = text.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\n"
                  "import com.myra.ai.MyraNativePlugin;"
              )

              text = text.replace(
                  "public class MainActivity extends BridgeActivity {",
                  """public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(MyraNativePlugin.class);
                  super.onCreate(savedInstanceState);
              }"""
              )

              p.write_text(text)
          PY

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
