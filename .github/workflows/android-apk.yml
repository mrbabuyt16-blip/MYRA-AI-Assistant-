name: Build MYRA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Add Android platform
        run: npx cap add android

      - name: Add MYRA Android permissions and service
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.CALL_PHONE",
              "android.permission.SEND_SMS",
              "android.permission.READ_SMS",
              "android.permission.RECEIVE_SMS",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MICROPHONE"
          ]

          for permission in permissions:
              line = f'    <uses-permission android:name="{permission}" />'

              if permission not in text:
                  text = text.replace(
                      "<application",
                      line + "\n    <application",
                      1
                  )

          service = '''
              <service
                  android:name=".MyraWakeService"
                  android:enabled="true"
                  android:exported="false"
                  android:foregroundServiceType="microphone" />
          '''

          if "MyraWakeService" not in text:
              text = text.replace(
                  "</application>",
                  service + "\n    </application>",
                  1
              )

          manifest.write_text(text)
          PY

      - name: Create MYRA Native Plugin
        run: |
          mkdir -p android/app/src/main/java/com/myra/ai

          cat > android/app/src/main/java/com/myra/ai/MyraNativePlugin.java <<'EOF'
          package com.myra.ai;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.provider.Settings;
          import android.telephony.SmsManager;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "MyraNative")
          public class MyraNativePlugin extends Plugin {

              @PluginMethod
              public void requestPermission(PluginCall call) {

                  String permission = call.getString("permission");

                  if (permission == null ||
                      permission.trim().isEmpty()) {
                      call.reject("Permission is required");
                      return;
                  }

                  String androidPermission;

                  switch (permission) {

                      case "RECORD_AUDIO":
                          androidPermission =
                                  Manifest.permission.RECORD_AUDIO;
                          break;

                      case "READ_CONTACTS":
                          androidPermission =
                                  Manifest.permission.READ_CONTACTS;
                          break;

                      case "CALL_PHONE":
                          androidPermission =
                                  Manifest.permission.CALL_PHONE;
                          break;

                      case "SEND_SMS":
                          androidPermission =
                                  Manifest.permission.SEND_SMS;
                          break;

                      case "POST_NOTIFICATIONS":

                          if (android.os.Build.VERSION.SDK_INT >= 33) {
                              androidPermission =
                                      Manifest.permission.POST_NOTIFICATIONS;
                          } else {
                              JSObject oldResult = new JSObject();
                              oldResult.put("granted", true);
                              call.resolve(oldResult);
                              return;
                          }

                          break;

                      default:
                          call.reject("Unsupported permission");
                          return;
                  }

                  boolean granted =
                          getContext().checkSelfPermission(
                                  androidPermission
                          ) == PackageManager.PERMISSION_GRANTED;

                  JSObject result = new JSObject();
                  result.put("granted", granted);

                  call.resolve(result);
              }

              @PluginMethod
              public void call(PluginCall call) {

                  String phone = call.getString("phone");

                  if (phone == null ||
                      phone.trim().isEmpty()) {
                      call.reject("Phone number is required");
                      return;
                  }

                  if (getContext().checkSelfPermission(
                          Manifest.permission.CALL_PHONE
                  ) != PackageManager.PERMISSION_GRANTED) {
                      call.reject("CALL_PHONE permission not granted");
                      return;
                  }

                  try {

                      Intent intent = new Intent(
                              Intent.ACTION_CALL,
                              Uri.parse("tel:" + phone)
                      );

                      intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      getContext().startActivity(intent);
                      call.resolve();

                  } catch (Exception e) {
                      call.reject(
                              "Unable to make call: " +
                              e.getMessage()
                      );
                  }
              }

              @PluginMethod
              public void sms(PluginCall call) {

                  String phone = call.getString("phone");
                  String message = call.getString("message");

                  if (phone == null ||
                      phone.trim().isEmpty()) {
                      call.reject("Phone number is required");
                      return;
                  }

                  if (message == null) {
                      message = "";
                  }

                  if (getContext().checkSelfPermission(
                          Manifest.permission.SEND_SMS
                  ) != PackageManager.PERMISSION_GRANTED) {
                      call.reject(
                              "SEND_SMS permission not granted"
                      );
                      return;
                  }

                  try {

                      SmsManager smsManager =
                              SmsManager.getDefault();

                      smsManager.sendTextMessage(
                              phone,
                              null,
                              message,
                              null,
                              null
                      );

                      call.resolve();

                  } catch (Exception e) {
                      call.reject(
                              "Unable to send SMS: " +
                              e.getMessage()
                      );
                  }
              }

              @PluginMethod
              public void openApp(PluginCall call) {

                  String packageName =
                          call.getString("packageName");

                  if (packageName == null ||
                      packageName.trim().isEmpty()) {
                      call.reject(
                              "Package name is required"
                      );
                      return;
                  }

                  try {

                      Intent intent =
                              getContext()
                                      .getPackageManager()
                                      .getLaunchIntentForPackage(
                                              packageName
                                      );

                      if (intent == null) {
                          call.reject(
                                  "App is not installed"
                          );
                          return;
                      }

                      intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      getContext().startActivity(intent);
                      call.resolve();

                  } catch (Exception e) {
                      call.reject(
                              "Unable to open app: " +
                              e.getMessage()
                      );
                  }
              }

              @PluginMethod
              public void openAppSettings(PluginCall call) {

                  try {

                      Intent intent = new Intent(
                              Settings.ACTION_APPLICATION_DETAILS_SETTINGS
                      );

                      intent.setData(
                              Uri.parse(
                                      "package:" +
                                      getContext()
                                              .getPackageName()
                              )
                      );

                      intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      getContext().startActivity(intent);
                      call.resolve();

                  } catch (Exception e) {
                      call.reject(
                              "Unable to open app settings: " +
                              e.getMessage()
                      );
                  }
              }
          }
          EOF

      - name: Create MYRA Wake Service
        run: |
          cat > android/app/src/main/java/com/myra/ai/MyraWakeService.java <<'EOF'
          package com.myra.ai;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MyraWakeService extends Service {

              private static final String CHANNEL_ID =
                      "myra_wake_channel";

              private SpeechRecognizer recognizer;

              private boolean running = true;

              @Override
              public void onCreate() {
                  super.onCreate();

                  createNotificationChannel();

                  Notification notification =
                          createNotification();

                  if (Build.VERSION.SDK_INT >= 29) {

                      startForeground(
                              1001,
                              notification,
                              android.content.pm.ServiceInfo
                                      .FOREGROUND_SERVICE_TYPE_MICROPHONE
                      );

                  } else {

                      startForeground(
                              1001,
                              notification
                      );
                  }

                  startRecognition();
              }

              private void startRecognition() {

                  if (!SpeechRecognizer.isRecognitionAvailable(
                          getApplicationContext()
                  )) {
                      return;
                  }

                  try {

                      if (recognizer != null) {
                          recognizer.destroy();
                      }

                      recognizer =
                              SpeechRecognizer.createSpeechRecognizer(
                                      getApplicationContext()
                              );

                      recognizer.setRecognitionListener(
                              new RecognitionListener() {

                                  @Override
                                  public void onResults(
                                          Bundle results
                                  ) {

                                      ArrayList<String> matches =
                                              results.getStringArrayList(
                                                      SpeechRecognizer
                                                              .RESULTS_RECOGNITION
                                              );

                                      if (matches != null) {

                                          for (String result :
                                                  matches) {

                                              String text =
                                                      result
                                                              .toLowerCase(
                                                                      Locale.US
                                                              )
                                                              .trim();

                                              if (
                                                  text.contains(
                                                          "hey myra"
                                                  ) ||
                                                  text.contains(
                                                          "hey mira"
                                                  )
                                              ) {

                                                  openMyra();

                                                  break;
                                              }
                                          }
                                      }

                                      restartRecognition();
                                  }

                                  @Override
                                  public void onError(
                                          int error
                                  ) {
                                      restartRecognition();
                                  }

                                  @Override
                                  public void onReadyForSpeech(
                                          android.os.Bundle params
                                  ) {}

                                  @Override
                                  public void onBeginningOfSpeech() {}

                                  @Override
                                  public void onRmsChanged(
                                          float rmsdB
                                  ) {}

                                  @Override
                                  public void onBufferReceived(
                                          byte[] buffer
                                  ) {}

                                  @Override
                                  public void onEndOfSpeech() {}

                                  @Override
                                  public void onPartialResults(
                                          android.os.Bundle partialResults
                                  ) {}

                                  @Override
                                  public void onEvent(
                                          int eventType,
                                          android.os.Bundle params
                                  ) {}
                              }
                      );

                      Intent intent =
                              new Intent(
                                      RecognizerIntent
                                              .ACTION_RECOGNIZE_SPEECH
                              );

                      intent.putExtra(
                              RecognizerIntent
                                      .EXTRA_LANGUAGE_MODEL,
                              RecognizerIntent
                                      .LANGUAGE_MODEL_FREE_FORM
                      );

                      intent.putExtra(
                              RecognizerIntent.EXTRA_LANGUAGE,
                              Locale.US.toLanguageTag()
                      );

                      intent.putExtra(
                              RecognizerIntent.EXTRA_PARTIAL_RESULTS,
                              true
                      );

                      recognizer.startListening(intent);

                  } catch (Exception e) {
                      restartRecognition();
                  }
              }

              private void restartRecognition() {

                  if (!running) {
                      return;
                  }

                  new android.os.Handler(
                          android.os.Looper.getMainLooper()
                  ).postDelayed(
                          this::startRecognition,
                          1200
                  );
              }

              private void openMyra() {

                  Intent intent =
                          new Intent(
                                  getApplicationContext(),
                                  MainActivity.class
                          );

                  intent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP
                  );

                  intent.putExtra(
                          "MYRA_WAKE",
                          true
                  );

                  getApplicationContext()
                          .startActivity(intent);
              }

              private Notification createNotification() {

                  Intent intent =
                          new Intent(
                                  this,
                                  MainActivity.class
                          );

                  PendingIntent pendingIntent =
                          PendingIntent.getActivity(
                                  this,
                                  0,
                                  intent,
                                  PendingIntent.FLAG_IMMUTABLE |
                                  PendingIntent.FLAG_UPDATE_CURRENT
                          );

                  return new Notification.Builder(
                          this,
                          CHANNEL_ID
                  )
                          .setContentTitle("MYRA AI")
                          .setContentText(
                                  "Hey Myra is ready"
                          )
                          .setSmallIcon(
                                  android.R.drawable.ic_btn_speak_now
                          )
                          .setContentIntent(
                                  pendingIntent
                          )
                          .setOngoing(true)
                          .build();
              }

              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                              new NotificationChannel(
                                      CHANNEL_ID,
                                      "MYRA Voice Assistant",
                                      NotificationManager
                                              .IMPORTANCE_LOW
                              );

                      NotificationManager manager =
                              getSystemService(
                                      NotificationManager.class
                              );

                      if (manager != null) {
                          manager.createNotificationChannel(
                                  channel
                          );
                      }
                  }
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId
              ) {

                  running = true;

                  return START_STICKY;
              }

              @Override
              public void onDestroy() {

                  running = false;

                  if (recognizer != null) {
                      recognizer.destroy();
                      recognizer = null;
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Configure MYRA MainActivity
        run: |
          cat > android/app/src/main/java/com/myra/ai/MainActivity.java <<'EOF'
          package com.myra.ai;

          import android.content.Intent;
          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(
                      Bundle savedInstanceState
              ) {

                  registerPlugin(
                          MyraNativePlugin.class
                  );

                  super.onCreate(
                          savedInstanceState
                  );

                  startMyraWakeService();

                  handleWakeIntent(
                          getIntent()
                  );
              }

              @Override
              protected void onNewIntent(
                      Intent intent
              ) {

                  super.onNewIntent(intent);

                  setIntent(intent);

                  handleWakeIntent(intent);
              }

              private void startMyraWakeService() {

                  try {

                      Intent serviceIntent =
                              new Intent(
                                      this,
                                      MyraWakeService.class
                              );

                      if (
                          android.os.Build.VERSION.SDK_INT >= 26
                      ) {

                          startForegroundService(
                                  serviceIntent
                          );

                      } else {

                          startService(
                                  serviceIntent
                          );
                      }

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void handleWakeIntent(
                      Intent intent
              ) {

                  if (
                      intent != null &&
                      intent.getBooleanExtra(
                              "MYRA_WAKE",
                              false
                      )
                  ) {

                      getWindow()
                              .getDecorView()
                              .postDelayed(
                                      () -> {

                                          if (getBridge() != null &&
                                              getBridge().getWebView() != null) {

                                              getBridge()
                                                      .getWebView()
                                                      .evaluateJavascript(
                                                              "window.dispatchEvent(new Event('myra-wake'));",
                                                              null
                                                      );
                                          }

                                      },
                                      900
                              );

                      intent.removeExtra("MYRA_WAKE");
                  }
              }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
