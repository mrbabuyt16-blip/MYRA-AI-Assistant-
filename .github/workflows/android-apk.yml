name: Build MYRA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ---------------------------------------------------------
      # MYRA NATIVE PLUGIN
      # ---------------------------------------------------------

      - name: Create MYRA Native Plugin
        run: |
          mkdir -p android/app/src/main/java/com/myra/ai

          cat > android/app/src/main/java/com/myra/ai/MyraNativePlugin.java <<'EOF'
          package com.myra.ai;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import android.telephony.SmsManager;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "MyraNative")
          public class MyraNativePlugin extends Plugin {

              @PluginMethod
              public void requestPermission(PluginCall call) {
                  String permission = call.getString("permission");

                  if (permission == null) {
                      call.reject("Permission is required");
                      return;
                  }

                  String androidPermission = null;

                  switch (permission) {
                      case "RECORD_AUDIO":
                          androidPermission = Manifest.permission.RECORD_AUDIO;
                          break;

                      case "READ_CONTACTS":
                          androidPermission = Manifest.permission.READ_CONTACTS;
                          break;

                      case "CALL_PHONE":
                          androidPermission = Manifest.permission.CALL_PHONE;
                          break;

                      case "SEND_SMS":
                          androidPermission = Manifest.permission.SEND_SMS;
                          break;

                      case "POST_NOTIFICATIONS":
                          if (Build.VERSION.SDK_INT >= 33) {
                              androidPermission =
                                      Manifest.permission.POST_NOTIFICATIONS;
                          } else {
                              JSObject result = new JSObject();
                              result.put("granted", true);
                              call.resolve(result);
                              return;
                          }
                          break;

                      default:
                          call.reject("Unsupported permission");
                          return;
                  }

                  if (getContext().checkSelfPermission(androidPermission)
                          == PackageManager.PERMISSION_GRANTED) {

                      JSObject result = new JSObject();
                      result.put("granted", true);
                      call.resolve(result);

                  } else {
                      requestPermissions(
                              new String[]{androidPermission},
                              "permissionCallback"
                      );

                      call.save();
                  }
              }

              @com.getcapacitor.annotation.PermissionCallback
              private void permissionCallback(PluginCall call) {
                  String permission = call.getString("permission");

                  String androidPermission = null;

                  if ("RECORD_AUDIO".equals(permission)) {
                      androidPermission = Manifest.permission.RECORD_AUDIO;
                  } else if ("READ_CONTACTS".equals(permission)) {
                      androidPermission = Manifest.permission.READ_CONTACTS;
                  } else if ("CALL_PHONE".equals(permission)) {
                      androidPermission = Manifest.permission.CALL_PHONE;
                  } else if ("SEND_SMS".equals(permission)) {
                      androidPermission = Manifest.permission.SEND_SMS;
                  } else if ("POST_NOTIFICATIONS".equals(permission)
                          && Build.VERSION.SDK_INT >= 33) {
                      androidPermission =
                              Manifest.permission.POST_NOTIFICATIONS;
                  }

                  boolean granted = androidPermission != null &&
                          getContext().checkSelfPermission(androidPermission)
                          == PackageManager.PERMISSION_GRANTED;

                  JSObject result = new JSObject();
                  result.put("granted", granted);
                  call.resolve(result);
              }

              @PluginMethod
              public void call(PluginCall call) {
                  String phone = call.getString("phone");

                  if (phone == null || phone.trim().isEmpty()) {
                      call.reject("Phone number is required");
                      return;
                  }

                  if (getContext().checkSelfPermission(
                          Manifest.permission.CALL_PHONE)
                          != PackageManager.PERMISSION_GRANTED) {

                      call.reject("CALL_PHONE permission not granted");
                      return;
                  }

                  try {
                      Intent intent = new Intent(
                              Intent.ACTION_CALL,
                              Uri.parse("tel:" + phone)
                      );

                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);

                      call.resolve();

                  } catch (Exception e) {
                      call.reject("Unable to make call: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void sms(PluginCall call) {
                  String phone = call.getString("phone");
                  String message = call.getString("message");

                  if (phone == null || phone.trim().isEmpty()) {
                      call.reject("Phone number is required");
                      return;
                  }

                  if (message == null) {
                      message = "";
                  }

                  if (getContext().checkSelfPermission(
                          Manifest.permission.SEND_SMS)
                          != PackageManager.PERMISSION_GRANTED) {

                      call.reject("SEND_SMS permission not granted");
                      return;
                  }

                  try {
                      SmsManager smsManager = SmsManager.getDefault();

                      smsManager.sendTextMessage(
                              phone,
                              null,
                              message,
                              null,
                              null
                      );

                      call.resolve();

                  } catch (Exception e) {
                      call.reject("Unable to send SMS: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void openApp(PluginCall call) {
                  String packageName = call.getString("packageName");

                  if (packageName == null || packageName.trim().isEmpty()) {
                      call.reject("Package name is required");
                      return;
                  }

                  try {
                      Intent intent =
                              getContext()
                                      .getPackageManager()
                                      .getLaunchIntentForPackage(packageName);

                      if (intent == null) {
                          call.reject("App is not installed");
                          return;
                      }

                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);

                      call.resolve();

                  } catch (Exception e) {
                      call.reject("Unable to open app: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void openAppSettings(PluginCall call) {
                  try {
                      Intent intent = new Intent(
                              Settings.ACTION_APPLICATION_DETAILS_SETTINGS
                      );

                      intent.setData(
                              Uri.parse(
                                      "package:" +
                                      getContext().getPackageName()
                              )
                      );

                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);

                      call.resolve();

                  } catch (Exception e) {
                      call.reject(
                              "Unable to open app settings: " +
                              e.getMessage()
                      );
                  }
              }
          }
          EOF

      # ---------------------------------------------------------
      # REGISTER PLUGIN
      # ---------------------------------------------------------

      - name: Register MYRA Native Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/java/com/myra/ai/MainActivity.java")

          text = p.read_text()

          if "MyraNativePlugin" not in text:
              text = text.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\n"
                  "import com.getcapacitor.Plugin;"
              )

              text = text.replace(
                  "public class MainActivity extends BridgeActivity {",
                  "public class MainActivity extends BridgeActivity {\n"
                  "\n"
                  "    @Override\n"
                  "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                  "        registerPlugin(MyraNativePlugin.class);\n"
                  "        super.onCreate(savedInstanceState);\n"
                  "    }"
              )

              p.write_text(text)
          PY

      # ---------------------------------------------------------
      # ANDROID PERMISSIONS
      # ---------------------------------------------------------

      - name: Add MYRA Android Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.READ_CONTACTS" />',
              '<uses-permission android:name="android.permission.CALL_PHONE" />',
              '<uses-permission android:name="android.permission.SEND_SMS" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          ]

          insert = "\n".join(permissions) + "\n"

          if "android.permission.RECORD_AUDIO" not in text:
              text = text.replace(
                  "<manifest",
                  "<manifest",
                  1
              )

              pos = text.find(">") + 1
              text = text[:pos] + "\n" + insert + text[pos:]

          p.write_text(text)
          PY

      # ---------------------------------------------------------
      # BUILD APK
      # ---------------------------------------------------------

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ---------------------------------------------------------
      # UPLOAD APK
      # ---------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
